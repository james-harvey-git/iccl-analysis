defaults:
  - config
  - _self_

performance:
  mode: numerical  # preflight | numerical | benchmark | trajectory
  variant: optimized  # baseline | optimized | group2 | group4; trajectory only
  initialization_seed: 0  # model initialization; the indexed data seed remains seed
  checkpoint: null  # optional full-state checkpoint for numerical/benchmark comparisons
  batches: 8  # fixed, identical batches shared by every benchmark variant
  repetitions: 3  # timed passes after warming each batch shape

wandb:
  mode: disabled

training:
  num_steps: 2000
  log_every: 50
  validation_every: 200
  monitor_every: 1000
  checkpoint_every: 1000000
  snapshots:
    every: null
    at: []

evaluation:
  upload_results: false
