# Variable-world HyperTeacher curriculum. `data=hyperteacher_fixed` selects the
# fixed M=8, T=8, D=32 training distribution.
name: hyperteacher

# Dimensions of each per-sequence HyperTeacher world.
input_dim: 16
output_dim: 16
hidden_dims: [16]          # hidden widths of the primitive MLP; one value per layer
use_bias: true             # include independently sampled primitive biases
# Sample M uniformly from the inclusive range after excluding held_out values.
num_modules:
  min: 4
  max: 12
  held_out: [6, 10]        # unique integers strictly between min and max
scale: 1.7320508075688772  # primitive weight variance scale; sqrt(3)
weighting: discrete        # binary | discrete | continuous task weights

sequence:
  # Relative form: T=M-1+S. constructive builds a spanning-tree backbone;
  # rejection samples all T tasks i.i.d. and conditions on the constraints.
  curriculum_sampler: constructive  # constructive | rejection
  hotness: 2                # active modules per task; relative form requires 2
  surplus_tasks: 1          # non-negative int or inclusive [min, max]
  # D may also be a positive int or inclusive [min, max]. This mapping makes
  # the sampling scope explicit; min == max is a fixed value and consumes no RNG.
  demos_per_task:
    min: 24
    max: 40
    scope: per_task         # per_sequence | per_task
  signal_boundaries: true   # insert a zero-loss boundary token before every task
  require_identifiable: true  # require full module coverage and connected support
  require_full_rank: false  # require task latents to span every used module
  max_attempts: 1000        # resampling limit for constrained curricula

eval_sets:
  num_sequences: 256       # per physical cell/condition and training validation
  demos_per_task: 32       # positive D shared by every capability task block
  out_dir: data/eval_sets  # frozen archives written by scripts/make_eval_sets.py
  bootstrap_seed: 0        # independent seed for confidence intervals
  bootstrap_replicates: 1000  # <2 disables bootstrap resampling
  best_metric: validation/token_mse  # raw token MSE on the training distribution
  capabilities: [icl, composition, retention]  # any subset of these three values
  canonical:
    module_count: 8          # M for standalone evaluation and train-time monitoring
    task_count: 8            # T; must satisfy T>=M-1
  module_counts:
    min: 4                  # inclusive evaluation range, independent of training bounds
    max: 12
  task_variation:
    surplus_tasks:
      min: 0                # inclusive S range; T=M-1+S
      max: 3
  composition:
    constituent_task_exposures: 1  # prior tasks containing each target module
    controls: [matched_prefix, no_history]  # matched_prefix required; no_history optional
  retention:
    repeat_positions: all   # balance repeats over every history position
    controls: [novel, shared]  # novel required; shared omitted for binary weighting

distribution_diagnostic:
  num_sequences: 10000       # sequences sampled by analyze_sequence_distribution.py
  bootstrap_seed: 0          # independent seed for diagnostic confidence intervals
  bootstrap_replicates: 1000  # <2 disables bootstrap resampling
