# Variable-world HyperTeacher curriculum. `data=hyperteacher_fixed` selects the
# fixed M=8, T=8, D=32 training distribution.
name: hyperteacher

input_dim: 16
output_dim: 16
hidden_dims: [16]
use_bias: true
num_modules:
  min: 4
  max: 12
  held_out: [6, 10]
scale: 1.7320508075688772  # sqrt(3)
weighting: discrete        # binary | discrete | continuous

sequence:
  curriculum_sampler: constructive  # constructive | rejection
  hotness: 2
  surplus_tasks: 1          # int or inclusive [lo, hi]
  demos_per_task:
    min: 24
    max: 40
    scope: per_task         # per_sequence | per_task
  signal_boundaries: true
  require_identifiable: true
  require_full_rank: false
  max_attempts: 1000

eval_sets:
  num_sequences: 256       # per capability cell and training-distribution validation set
  out_dir: data/eval_sets
  bootstrap_seed: 0
  bootstrap_replicates: 1000
  best_metric: validation/token_mse  # evaluation scalar minimized when selecting best.pt
  module_counts:
    seen_selection: endpoints_and_canonical
    canonical_seen: 8
    ood: [13, 16]

  capabilities:
    enabled: [icl, composition, retention]
    composition:
      target_demos: 16
      constituent_task_exposures: 1
      controls: [matched_prefix, no_history]
    retention:
      revisit_demos: 16
      controls: [novel, shared]

  structural_slices:
    enabled:
      - fixed_surplus
      - matched_task_count
      - matched_prediction_tokens
      - task_count
      - history_demos
      - matched_serialized_prefix
      - demo_allocation

    fixed_surplus:
      surplus_tasks: 1
      history_demos_per_task: 32

    matched_task_count:
      task_count: 15
      history_demos_per_task: 32

    matched_prediction_tokens:
      prediction_tokens: 480
      surplus_tasks: 1

    task_count:
      module_count: 8
      values: [7, 8, 10, 12, 15]
      history_demos_per_task: 32

    history_demos:
      module_count: 8
      task_count: 8
      values: [8, 16, 32, 64]

    matched_serialized_prefix:
      module_count: 8
      serialized_tokens: 520
      task_counts: [8, 10, 12]

    demo_allocation:
      module_count: 8
      task_count: 8
      prediction_tokens: 256
      patterns: [uniform, alternating, front_loaded, back_loaded]

distribution_diagnostic:
  num_sequences: 10000
  bootstrap_seed: 0
  bootstrap_replicates: 1000
