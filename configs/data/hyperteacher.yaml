# Task-family parameters follow the source HyperTeacher semantics
# (smonsays/scale-compositionality); pilot values per the dataset spec (#1).
name: hyperteacher

input_dim: 16
output_dim: 16
hidden_dims: [16]
use_bias: true
num_modules: 8
scale: 1.7320508075688772  # sqrt(3)
weighting: discrete        # binary | discrete | continuous

sequence:
  phases:
    - {num_tasks: 8, hotness: [2, 2]}
  demos_per_task: 32       # int, or [lo, hi] range (required for the unsignalled ablation)
  signal_boundaries: true
  require_identifiable: true
  require_full_rank: false
  task_graph: random       # random | chain | ring | star (structured families are 2-hot only)
  graph_ordered: false     # structured families only: present e.g. a chain in path order

eval_sets:
  num_sequences: 256
  out_dir: data/eval_sets
  composite:
    hotness: 2
    num_demos: 8
  structural_graphs: [chain, ring, star]
  retention:
    revisit_demos: 16

