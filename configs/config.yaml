defaults:
  - data: hyperteacher
  - model: gdn
  - training: default
  - _self_

seed: 0

# "auto" resolves to cuda > mps > cpu at runtime.
device: auto

wandb:
  mode: disabled # online | offline (Isambard compute nodes; `wandb sync` after) | disabled
  project: iccl-analysis
  entity: jublett-university-of-oxford

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
