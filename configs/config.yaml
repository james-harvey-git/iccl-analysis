defaults:
  - data: hyperteacher
  - model: gdn
  - training: default
  - _self_

seed: 0

# "auto" resolves to cuda > mps > cpu at runtime.
device: auto

wandb:
  mode: disabled # online | offline (`wandb sync` after) | disabled; cluster jobs pass online
  project: iccl-analysis
  entity: jublett-university-of-oxford
  name: null # null keeps W&B's generated name (e.g. `different-sound-6`)
  # Uploads the final snapshot as an artifact at the end of a run; no-op when
  # mode is disabled. Covers only that automatic upload — promoting a full
  # series is `scripts/upload_snapshots.py`, which needs no flag.
  upload_weights: false

# Deterministic, known-world, current-task-only evaluation reference (#13).
# It is computed from frozen suites and never logged through the training W&B
# path. The plotting script reads `training.resume` as its checkpoint source.
bayes_oracle:
  suite: in_dist
  suite_path: null
  cache_dir: outputs/bayes_oracle
  cache_path: null
  atol: 1.0e-5
  rtol: 1.0e-5
  candidate_chunk_size: 128
  store_full_covariance: false
  sensitivity_tolerances:
    - [1.0e-6, 1.0e-6]
    - [1.0e-4, 1.0e-4]
  plotting:
    task_position: 8
    output_dir: outputs/figures
    bootstrap_seed: 0
    bootstrap_replicates: 10000
    include_raw_mse: true
# Generator-aware random-feature GP comparison (#14). These fixed evaluation
# references are cached locally and never logged through the training W&B path.
structured_observer:
  suite: in_dist
  suite_path: null
  modes: [full_history, current_task]
  device: cpu
  sequence_limit: null
  cache_dir: outputs/structured_observer
  cache_path: null
  kernel:
    num_features: 2048
    seed: 0
    dtype: float64
    relative_jitter: 1.0e-8
    max_relative_jitter: 1.0e-5
  smc:
    num_particles: 1024
    seeds: [0, 1, 2]
    ess_fraction: 0.5
    task_end_rejuvenation_sweeps: 2
    max_completion_attempts: 10000
    initial_gp_capacity: 8
  plotting:
    task_position: 8
    output_dir: outputs/figures/structured_observer
    bootstrap_seed: 0
    bootstrap_replicates: 10000
    include_raw_mse: true
  calibration:
    sequence_limit: 32
    feature_counts: [512, 1024, 2048]
    particle_counts: [256, 512, 1024, 2048]
    cache_dir: outputs/structured_observer/convergence/cache
    output_dir: outputs/figures/structured_observer/convergence
    thresholds:
      kernel_relative_frobenius: 0.01
      curve_max_abs_change: 0.02
      seed_standard_error: 0.01
      relative_jitter: 1.0e-5

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
