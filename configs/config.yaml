defaults:
  - data: hyperteacher
  - model: gdn
  - training: default
  - _self_

seed: 0  # root seed for model initialization and indexed data streams

# auto resolves cuda > mps > cpu; explicit values include cpu, mps, cuda, cuda:<index>.
device: auto

wandb:
  mode: disabled  # online | offline (`wandb sync` after) | disabled
  project: iccl-analysis
  entity: jublett-university-of-oxford
  name: null  # null keeps W&B's generated name (e.g. `different-sound-6`)
  # Uploads the final snapshot as an artifact at the end of a run; no-op when
  # mode is disabled. Covers only that automatic upload — promoting a full
  # series is `scripts/upload_snapshots.py`, which needs no flag.
  upload_weights: false

evaluation:
  # One or more local or wandb:// checkpoint references. Multiple entries form
  # one trajectory and must be ordered by increasing training step.
  checkpoints: []  # required by scripts/eval.py; unrelated to training.resume
  upload_results: true  # upload complete numerical results; no-op with W&B disabled

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
