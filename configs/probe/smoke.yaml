defaults:
  - task_vector
  - _self_

dataset:
  num_worlds: 2
  demos_per_task: 4
  trajectories: {train: 32, validation: 12, test_familiar: 16, test_unseen: 12}
  shard_size: 16
  capture:
    batch_size: 2
    representations:
      residual_after_mixer: [all_layers]
      residual_after_mlp: [all_layers]
      mlp_hidden: [all_layers]
      state: [all_layers]
      head_read: [all_layers]

training:
  l2_grid: [0.1, 1.0]
  solver:
    row_batch_size: 16
  monitoring:
    log_every_iterations: 2
    validation_every_iterations: 2
    checkpoint_every_iterations: 4
    train_subset_size: 16
    validation_subset_size: 12

evaluation:
  bootstrap_replicates: 100
  exposure:
    min_trials_per_world_cell: 4
    min_worlds_per_cell: 2
