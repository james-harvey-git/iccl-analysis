defaults:
  - probe: task_vector
  - _self_

experiment:
  name: task-vector-study
  phase: development              # development | confirmation; RNG worlds are disjoint.
  root: outputs/task-vector/${experiment.name}
  seed: 0
  protocol_frozen: false          # Required for confirmation, after development choices.

device: auto                     # cuda > mps > cpu
torch_num_threads: 1
float32_matmul_precision: highest

execution:
  max_gpus: 8                     # Hard upper limit; Slurm tasks each use one GPU.
  stage_timeout_seconds: 3600     # Maximum wait for other workers at stage completion.

wandb:
  mode: disabled                 # disabled | offline | online
  project: iccl-analysis
  entity: jublett-university-of-oxford
  name: ${experiment.name}
  run_id_file: ${experiment.root}/wandb-run.json
  upload_results: true            # Compact tables/figures/configuration only.
  upload_activations: false       # Bulk arrays remain on scratch.

hydra:
  job:
    chdir: false
  run:
    dir: ${experiment.root}/${experiment.phase}/logs/${hydra:job.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/task-vector/${now:%Y-%m-%d_%H-%M-%S}
