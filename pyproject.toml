[project]
name = "iccl-analysis"
version = "0.1.0"
description = "In-context continual learning in linear-attention models: synthetic dataset, training, and mechanistic interpretability analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "flash-linear-attention>=0.4.0 ; sys_platform == 'linux'",
    "hydra-core>=1.3.4",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "plotly>=6.9.0",
    # FLA's Hopper backward workaround for the ARM CUDA 12.8 / PyTorch stack.
    "tilelang>=0.1.9 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "torch>=2.11.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iccl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# F722 misreads jaxtyping shape annotations as broken forward references.
ignore = ["F722"]

[tool.ruff.format]
# Notebooks are exploratory scratch; reformatting them churns cell source and
# noises up unrelated diffs. They are still linted.
exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA GPU with the fla kernels installed (run on the cluster)",
]

[tool.pyright]
include = ["src", "scripts", "tests"]
typeCheckingMode = "standard"
