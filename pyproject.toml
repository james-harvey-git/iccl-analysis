[project]
name = "iccl-analysis"
version = "0.1.0"
description = "In-context continual learning in linear-attention models: synthetic dataset, training, and mechanistic interpretability analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "hydra-core>=1.3.4",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iccl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "scripts", "tests"]
typeCheckingMode = "standard"
